<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>萌萌小队 · 下赛季阵容表</title>
<style>
:root{
  --bg:#0e1014; --card:#171a21; --line:#252a34; --ink:#e9ecf2; --dim:#8b93a7;
  --pink:#ff7ba9; --pink2:#ff9fc0; --blue:#4d8dff;
  --gold:#ffcf4d; --green:#45d68a; --purple:#a97bff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;padding:18px 14px 60px;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:14px;line-height:1.5;
}
.wrap{max-width:1100px;margin:0 auto}
header{margin-bottom:14px}
h1{font-size:20px;margin:0 0 5px;font-weight:700;
  background:linear-gradient(90deg,var(--pink),var(--pink2),#c9a9ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--dim);font-size:12.5px}

/* ── 前三榜单 ── */
.tops{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);margin:14px 0 12px}
.topcard{
  background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;
  border-left:3px solid var(--dim);min-width:0
}
.topcard.red{border-left-color:var(--gold)}
.topcard.kh{border-left-color:var(--green)}
.topcard.wx{border-left-color:var(--purple)}
.tlabel{font-size:12px;color:var(--dim);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.tlabel b{color:var(--ink);font-weight:600}
.tnames{display:flex;flex-direction:column;gap:4px}
.trow{display:flex;align-items:center;gap:7px;font-size:13.5px;min-width:0}
.trow .medal{font-size:12px;width:15px;flex:0 0 15px;text-align:center}
.trow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .val{margin-left:auto;color:var(--dim);font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.trow.empty{color:#5c6577;font-size:12.5px;font-weight:400}
.topcard.red .medal{color:var(--gold)}
.topcard.kh .medal{color:var(--green)}
.topcard.wx .medal{color:var(--purple)}

.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px;align-items:center}
button{
  font:inherit;font-size:13px;padding:8px 14px;border-radius:9px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer;transition:.15s;white-space:nowrap
}
button:hover{border-color:#3a4150;background:#1d212a}
button:active{transform:scale(.97)}
button.primary{background:linear-gradient(135deg,var(--pink),#e85f95);border-color:transparent;color:#fff;font-weight:600}
button.ghost{background:transparent}
.stat{margin-left:auto;color:var(--dim);font-size:12px}
.stat b{color:var(--ink);font-weight:600}

.tablebox{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:900px}
th{
  background:#141821;color:var(--dim);font-weight:600;font-size:12px;text-align:left;
  padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;z-index:2;cursor:pointer;user-select:none
}
th:hover{color:var(--ink)}
th .arw{opacity:.35;font-size:10px;margin-left:2px}
th.sorted .arw{opacity:1;color:var(--pink)}
td{padding:6px 8px;border-bottom:1px solid #1e222b;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1b1f28}
.idx{color:#5c6577;font-size:12px;text-align:center;width:34px}
input,select{
  font:inherit;font-size:13.5px;width:100%;padding:7px 9px;border-radius:7px;
  background:#0f131a;border:1px solid #232833;color:var(--ink);outline:none
}
input:focus,select:focus{border-color:var(--pink);box-shadow:0 0 0 2px rgba(255,123,169,.15)}
input.name{font-weight:600}
input.num{text-align:center;font-variant-numeric:tabular-nums}
.nmcell{display:flex;align-items:center;gap:4px}
.crown{
  font-size:13px;line-height:1;flex:0 0 auto;cursor:default;
  padding:2px 3px;border-radius:5px
}
.crown.red{background:rgba(255,207,77,.16)}
.crown.kh{background:rgba(69,214,138,.16)}
.crown.wx{background:rgba(169,123,255,.16)}
.del{
  border:none;background:transparent;color:#5c6577;font-size:17px;cursor:pointer;
  padding:4px 8px;border-radius:6px;line-height:1
}
.del:hover{color:#ff6b6b;background:rgba(255,107,107,.1)}
.filled{border-color:rgba(62,207,142,.35)!important}
footer{margin-top:16px;color:#6b7385;font-size:12px;line-height:1.8}
@media(max-width:600px){
  body{padding:14px 10px 50px}
  h1{font-size:18px}
  .tops{grid-template-columns:1fr;gap:8px}
  .stat{margin-left:0;width:100%;order:9}
  th,td{padding:8px 7px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>萌萌小队 · 下赛季阵容表</h1>
    <div class="sub">点任意格子直接改 · 自动保存在本机 · 点表头可排序</div>
  </header>

  <div class="tops" id="tops"></div>

  <div class="bar">
    <button class="primary" id="addBtn">+ 添加队员</button>
    <button id="copyBtn">复制成表格</button>
    <button id="csvBtn">导出 Excel</button>
    <button class="ghost" id="resetBtn">恢复预置名单</button>
    <div class="stat" id="stat"></div>
  </div>

  <div class="tablebox">
    <div class="scroll">
      <table id="tb">
        <thead>
          <tr>
            <th class="idx">#</th>
            <th data-k="nick">昵称<span class="arw">↕</span></th>
            <th data-k="gid">下赛季ID<span class="arw">↕</span></th>
            <th data-k="job">下赛季职业<span class="arw">↕</span></th>
            <th data-k="red">红度<span class="arw">↕</span></th>
            <th data-k="kaihuang">开荒排名<span class="arw">↕</span></th>
            <th data-k="wuxun">武勋排名<span class="arw">↕</span></th>
            <th style="width:44px"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <footer>
    · 数据只存在你手机/电脑的浏览器里，不上传任何服务器<br>
    · 「繁荣」取的是开荒排名（数字越小越靠前）<br>
    · 「复制成表格」→ 可直接粘贴到微信/Excel ｜「导出 Excel」→ 下载 CSV
  </footer>
</div>

<script>
(function(){
  const KEY='mengmeng_roster_v3';
  const PRESET=[
    ['咚咚','萌萌哒双皮奶'],['冬川','萌萌哒豆沙包'],['夜幕','萌萌哒蛋黄酥'],
    ['老王','萌萌哒奶黄包'],['正哥','萌萌哒叉烧包'],['洋哥','萌萌哒菠萝包'],
    ['萌音','萌萌哒小蛋糕'],['奶盖','萌萌哒瑞士卷'],['乱漩','萌萌哒苹果派'],
    ['强哥','萌萌哒马卡龙'],['微光','萌萌哒甜甜圈'],['小故事','萌萌哒小布丁'],
    ['哈基米','萌萌哒烧仙草'],['熊猫','萌萌哒芋泥包'],['苏木','萌萌哒铜锣烧'],
    ['初心','萌萌哒栗子烧'],['希望','萌萌哒雪媚娘']
  ].map(a=>({nick:a[0],gid:a[1],job:'',red:'',kaihuang:'',wuxun:''}));

  const REDS=['千抽一','千抽二','千抽三','千抽四','千抽五','千抽六','千抽七','千抽八','千抽九',
              '万抽一','万抽二','万抽三','万抽四','万抽五','万抽六','万抽七','万抽八','万抽九','万抽大圆满',
              '极一','极二','极三','极四','极五','极六','极七'];
  const RED_ORDER={}; REDS.forEach((r,i)=>RED_ORDER[r]=i+1);
  const JOBS=['司仓','神行','天工','青囊','奇佐','镇军'];
  const JOB_ORDER={}; JOBS.forEach((j,i)=>JOB_ORDER[j]=i+1);
  const MEDALS=['🥇','🥈','🥉'];

  let rows=[], sort={k:null,dir:1};

  function load(){
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){const d=JSON.parse(raw); if(Array.isArray(d)&&d.length){rows=d;return;}}
    }catch(e){}
    rows=JSON.parse(JSON.stringify(PRESET));
  }
  let saveTimer=null;
  function save(){
    clearTimeout(saveTimer);
    saveTimer=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(rows));}catch(e){}},250);
  }

  /* ───── 前三计算 ───── */
  function redVal(r){ return RED_ORDER[r.red]||null; }
  function numVal(r,f){ const v=parseFloat(r[f]); return (r[f]===''||r[f]==null||isNaN(v))?null:v; }

  // dir: -1 数值越大越好（红度），1 数值越小越好（排名）
  function topN(getVal,dir,n){
    const arr=[];
    rows.forEach((r,i)=>{const v=getVal(r); if(v!==null) arr.push({i,v});});
    if(!arr.length) return [];
    arr.sort((a,b)=> dir===-1 ? b.v-a.v : a.v-b.v);
    const out=[];
    for(let k=0;k<arr.length;k++){
      if(k<n) out.push(arr[k]);
      else if(arr[k].v===arr[n-1].v) out.push(arr[k]);   // 并列也上榜
      else break;
    }
    return out;
  }

  function computeTops(){
    return {
      red: topN(redVal,-1,3),
      kh : topN(r=>numVal(r,'kaihuang'),1,3),
      wx : topN(r=>numVal(r,'wuxun'),1,3)
    };
  }

  function renderTops(){
    const t=computeTops();
    const box=document.getElementById('tops');
    const mk=(cls,title,items,unit)=>{
      let inner='';
      if(!items.length){
        inner='<div class="trow empty">还没有填写</div>';
      }else{
        items.forEach((o,k)=>{
          const nm=rows[o.i].nick||'（未填昵称）';
          const val=unit==='red'?rows[o.i].red:'第'+o.v+'名';
          inner+=`<div class="trow"><span class="medal">${MEDALS[k]||'·'}</span>`+
                 `<span class="nm">${esc(nm)}</span><span class="val">${esc(val)}</span></div>`;
        });
      }
      return `<div class="topcard ${cls}"><div class="tlabel">👑 <b>${title}</b></div>`+
             `<div class="tnames">${inner}</div></div>`;
    };
    box.innerHTML = mk('red','红度前三',t.red,'red')
                  + mk('kh','繁荣前三',t.kh,'num')
                  + mk('wx','武勋前三',t.wx,'num');
  }

  function crownMap(t){
    const m={};
    const add=(list,k)=>list.forEach(o=>{(m[o.i]=m[o.i]||[]).push(k);});
    add(t.red,'red'); add(t.kh,'kh'); add(t.wx,'wx');
    return m;
  }

  /* ───── 表格 ───── */
  function sortVal(r,k){
    if(k==='red') return RED_ORDER[r.red]||0;
    if(k==='job') return JOB_ORDER[r.job]||99;
    if(k==='kaihuang'||k==='wuxun'){
      const v=parseFloat(r[k]); return isNaN(v)?Infinity:v;
    }
    return (r[k]||'').toString();
  }

  function render(){
    const tb=document.getElementById('tbody');
    const crowns=crownMap(computeTops());
    const view=rows.map((r,i)=>({r,i}));
    if(sort.k){
      const k=sort.k,dir=sort.dir;
      view.sort((a,b)=>{
        const va=sortVal(a.r,k),vb=sortVal(b.r,k);
        if(typeof va==='number'&&typeof vb==='number') return (va-vb)*dir;
        return String(va).localeCompare(String(vb),'zh')*dir;
      });
    }
    tb.innerHTML='';
    view.forEach(({r},pos)=>{
      const realIdx=rows.indexOf(r);
      const cs=crowns[realIdx]||[];
      const crownHtml=cs.map(c=>{
        const tip={red:'红度前三',kh:'繁荣前三',wx:'武勋前三'}[c];
        return `<span class="crown ${c}" title="${tip}">👑</span>`;
      }).join('');
      const tr=document.createElement('tr');
      tr.innerHTML=`
        <td class="idx">${pos+1}</td>
        <td><div class="nmcell">${crownHtml}<input class="name" data-i="${realIdx}" data-f="nick" value="${esc(r.nick)}" placeholder="昵称"></div></td>
        <td><input data-i="${realIdx}" data-f="gid" value="${esc(r.gid)}" placeholder="萌萌哒…"></td>
        <td><select data-i="${realIdx}" data-f="job">${jobOpts(r.job)}</select></td>
        <td><select data-i="${realIdx}" data-f="red">${redOpts(r.red)}</select></td>
        <td><input class="num" data-i="${realIdx}" data-f="kaihuang" value="${esc(r.kaihuang)}" placeholder="—" inputmode="numeric"></td>
        <td><input class="num" data-i="${realIdx}" data-f="wuxun" value="${esc(r.wuxun)}" placeholder="—" inputmode="numeric"></td>
        <td><button class="del" data-del="${realIdx}" title="删除">×</button></td>`;
      tb.appendChild(tr);
      if(r.red) tr.querySelector('select[data-f="red"]').classList.add('filled');
    });
    renderTops();
    updateStat();
  }

  function redOpts(cur){
    let o='<option value="">—</option>';
    REDS.forEach(r=>{o+=`<option value="${r}"${r===cur?' selected':''}>${r}</option>`;});
    return o;
  }
  function jobOpts(cur){
    let o='<option value="">—</option>';
    JOBS.forEach(j=>{o+=`<option value="${j}"${j===cur?' selected':''}>${j}</option>`;});
    return o;
  }
  function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

  function updateStat(){
    const n=rows.length;
    const redN=rows.filter(r=>r.red).length;
    const kh=rows.filter(r=>numVal(r,'kaihuang')!==null).length;
    const wx=rows.filter(r=>numVal(r,'wuxun')!==null).length;
    document.getElementById('stat').innerHTML=
      `共 <b>${n}</b> 人 · 红度 <b>${redN}/${n}</b> · 开荒 <b>${kh}/${n}</b> · 武勋 <b>${wx}/${n}</b>`;
  }

  document.getElementById('tbody').addEventListener('input',e=>{
    const el=e.target;
    if(el.dataset.i===undefined) return;
    const i=+el.dataset.i, f=el.dataset.f;
    rows[i][f]=el.value;
    if(f==='red') el.classList.toggle('filled',!!el.value);
    save();
    if(f==='red'||f==='kaihuang'||f==='wuxun'||f==='nick') renderKeepFocus();
    else updateStat();
  });

  // 重绘整表（刷新皇冠/前三榜），但保持输入焦点与光标位置，避免打字被打断
  function renderKeepFocus(){
    const ae=document.activeElement;
    const i=ae&&ae.dataset?ae.dataset.i:undefined;
    const f=ae&&ae.dataset?ae.dataset.f:undefined;
    let pos=null;
    try{pos=(ae&&ae.selectionStart!=null)?ae.selectionStart:null;}catch(e){}
    render();
    if(i!==undefined&&f){
      const el=document.querySelector(`#tbody [data-i="${i}"][data-f="${f}"]`);
      if(el){
        el.focus();
        try{if(pos!=null&&el.setSelectionRange) el.setSelectionRange(pos,pos);}catch(e){}
      }
    }
  }

  document.getElementById('tbody').addEventListener('change',e=>{
    if(e.target.tagName==='SELECT') e.target.dispatchEvent(new Event('input',{bubbles:true}));
  });

  document.getElementById('tbody').addEventListener('click',e=>{
    const b=e.target.closest('[data-del]');
    if(!b) return;
    const i=+b.dataset.del;
    if(!confirm(`确定删除「${rows[i].nick||'该队员'}」？`)) return;
    rows.splice(i,1); save(); render();
  });

  document.querySelectorAll('th[data-k]').forEach(th=>{
    th.addEventListener('click',()=>{
      const k=th.dataset.k;
      if(sort.k===k){sort.dir*=-1;} else {sort.k=k;sort.dir=1;}
      document.querySelectorAll('th[data-k]').forEach(t=>t.classList.remove('sorted'));
      th.classList.add('sorted');
      th.querySelector('.arw').textContent=sort.dir===1?'↑':'↓';
      render();
    });
  });

  document.getElementById('addBtn').onclick=()=>{
    rows.push({nick:'',gid:'',job:'',red:'',kaihuang:'',wuxun:''});
    save(); render();
    const box=document.querySelector('.scroll'); box.scrollTop=box.scrollHeight;
  };

  document.getElementById('copyBtn').onclick=()=>{
    const head=['昵称','下赛季ID','下赛季职业','红度','开荒排名','武勋排名'].join('\t');
    const body=rows.map(r=>[r.nick,r.gid,r.job,r.red,r.kaihuang,r.wuxun].join('\t')).join('\n');
    const txt=head+'\n'+body;
    navigator.clipboard?.writeText(txt).then(
      ()=>toast('已复制，可直接粘贴到微信或 Excel'),
      ()=>fallbackCopy(txt)
    );
  };

  function fallbackCopy(txt){
    const ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');toast('已复制');}catch(e){toast('复制失败，请长按选择');}
    document.body.removeChild(ta);
  }

  document.getElementById('csvBtn').onclick=()=>{
    const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
    let csv='\ufeff昵称,下赛季ID,下赛季职业,红度,开荒排名,武勋排名\n';
    rows.forEach(r=>{csv+=[r.nick,r.gid,r.job,r.red,r.kaihuang,r.wuxun].map(q).join(',')+'\n';});
    const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='萌萌小队阵容表.csv';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    toast('已导出 CSV');
  };

  document.getElementById('resetBtn').onclick=()=>{
    if(!confirm('恢复成最初的 17 人名单？当前填写的内容会丢失。')) return;
    rows=JSON.parse(JSON.stringify(PRESET)); save(); render(); toast('已恢复预置名单');
  };

  function toast(msg){
    const d=document.createElement('div');
    d.textContent=msg;
    d.style.cssText='position:fixed;left:50%;bottom:34px;transform:translateX(-50%);'+
      'background:#2a2f3a;color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;'+
      'z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.4);opacity:0;transition:.25s';
    document.body.appendChild(d);
    requestAnimationFrame(()=>d.style.opacity='1');
    setTimeout(()=>{d.style.opacity='0';setTimeout(()=>d.remove(),300);},1800);
  }

  load(); render();
})();
</script>
</body>
</html>
